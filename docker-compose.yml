# Infraestructura local de RepuSense.
# Solo Postgres y Redis: el backend corre en la maquina con `pnpm dev:backend`.
#
#   docker compose up -d      levantar
#   docker compose ps         estado
#   docker compose logs -f    logs
#   docker compose down       parar
#   docker compose down -v    parar y BORRAR los datos

name: repusense

services:
  postgres:
    image: postgres:16
    container_name: repusense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repusense
      POSTGRES_PASSWORD: repusense
      POSTGRES_DB: repusense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repusense -d repusense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repusense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repusense-worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://repusense:repusense@postgres:5432/repusense
      REDIS_URL: redis://redis:6379/0
    profiles:
      - worker
      - full

volumes:
  postgres_data:
  redis_data:
